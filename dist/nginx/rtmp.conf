# Include ONCE in nginx.conf's MAIN context, outside http {}.
# Requires ngx_rtmp_module (Ubuntu: libnginx-mod-rtmp).
rtmp {
    server {
        listen @RTMP_PORT@;
        chunk_size 4096;
        timeout 10s;
        ping 10s;
        ping_timeout 5s;
        access_log off;

        application inlive {
            live on;
            record off;
            deny play all;
            notify_method get;
            on_publish http://127.0.0.1:@AUTH_PORT@/publish;
            # No secret on the internal connection; no transcoding or recording.
            push rtmp://127.0.0.1:@INGEST_PORT@/live/muronaar;
            push_reconnect 1s;
        }
    }
}
