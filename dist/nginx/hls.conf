# Include inside your public HTTP/HTTPS server {}.
# Serve only published HLS artifacts; never expose configs or temporary files.
location ^~ /vod/ {
    alias @HLS_DIR@/;
    autoindex off;
    open_file_cache off;
    expires off;
    if ($uri !~ "^/vod/(master\.m3u8|stream(-720|-480|-240)?\.m3u8|segment-[0-9]+(-(1080|720|480|240))?-[0-9]+\.m4s|init-[0-9]+(-(1080|720|480|240))?\.mp4)$") {
        return 404;
    }
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp4 mp4 m4s;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    limit_except GET HEAD { deny all; }
}
