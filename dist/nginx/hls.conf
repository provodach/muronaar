# Include inside your EXISTING public HTTP/HTTPS server {}.
# /vod/ is removed before proxying to Liquidsoap's HTTP origin.
location = /vod/stream.m3u8 {
    proxy_pass http://127.0.0.1:@HLS_PORT@/stream.m3u8;
    include @INSTALL_DIR@/nginx/hls-playlist.conf;
}
location = /vod/stream-720.m3u8 {
    proxy_pass http://127.0.0.1:@HLS_PORT@/stream-720.m3u8;
    include @INSTALL_DIR@/nginx/hls-playlist.conf;
}
location = /vod/stream-480.m3u8 {
    proxy_pass http://127.0.0.1:@HLS_PORT@/stream-480.m3u8;
    include @INSTALL_DIR@/nginx/hls-playlist.conf;
}
location = /vod/master.m3u8 {
    proxy_pass http://127.0.0.1:@HLS_PORT@/master.m3u8;
    include @INSTALL_DIR@/nginx/hls-playlist.conf;
}
location ^~ /vod/ {
    proxy_pass http://127.0.0.1:@HLS_PORT@/;
    include @INSTALL_DIR@/nginx/hls-common.conf;
    proxy_cache_valid 200 10m;
    add_header X-Cache-Status $upstream_cache_status always;
    # Keep origin no-store on errors; do not cache missing/expired segments.
}
