# Include ONCE inside nginx's http {} context.
proxy_cache_path /var/cache/nginx/muronaar_hls levels=1:2
    keys_zone=muronaar_hls:10m max_size=512m inactive=10m use_temp_path=off;

# Local publication authorization callback; never exposed by the public vhost.
server {
    listen 127.0.0.1:@AUTH_PORT@;
    server_name localhost;
    access_log off;

    location = /publish {
        if ($arg_app != "inlive") { return 403; }
        if ($arg_name != "@STREAM_KEY@") { return 403; }
        return 204;
    }
    location / { return 404; }
}
